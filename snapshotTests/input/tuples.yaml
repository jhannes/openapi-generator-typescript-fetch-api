openapi: 3.0.2
info:
  title: Tuples
  description: Arrays with maxItems, which are generated as tuple types
  version: 0.1.0
paths:
  /routes:
    get:
      operationId: getRoute
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
components:
  schemas:
    Route:
      type: object
      required: [endpoints]
      properties:
        endpoints:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: string
        aliases:
          type: array
          maxItems: 2
          items:
            type: string
        primaryAlias:
          type: array
          maxItems: 1
          items:
            type: string
        transportModes:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/TransportMode'
        boundingBox:
          type: array
          minItems: 2
          maxItems: 4
          items:
            type: number
        stops:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/Stop'
    Stop:
      type: object
      properties:
        name:
          type: string
    TransportMode:
      type: string
      enum: [bus, train, ferry]
